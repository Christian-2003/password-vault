<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8" />
    <title>A4 Page Test</title>
    <style>
        :root {
            --color-surface: #FFFFFF; /* #FAF9FE */
            --color-surface-variant: #E9E7EC;
            --color-primary: #1D7874;
            --color-on-surface: #1B1A1F;
            --color-on-surface-variant: #444750;
            --color-outline: #C5C7C6;

            --margin-horizontal: 8px;
            --padding-horizontal: 6px;
            --padding-vertical: 4px;

            --image-small: 20px;
            --image-medium: 28px;
            --image-large: 36px;

            --corner-small: 8px;
            --corner-medium: 12px;
            --corner-large: 16px;

            --font-body-small: 8px;
            --font-body-medium: 12px;
            --font-body-large: 16px;

            --line-thickness: 1px;
        }


        body {
            background: var(--color-surface);
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--color-on-surface);
        }

        @page {
            size: A4;
            margin: 0.5in;
        }


        .account-card {
            background-color: var(--color-surface);
            border: var(--color-outline) solid var(--line-thickness);
            border-radius: var(--corner-large);
            margin: var(--padding-vertical) var(--margin-horizontal);
            display: grid;
            grid-template-columns: 50% 50%;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .header {
            display: flex;
            flex-direction: row;
            margin-left: var(--padding-horizontal);
            margin-top: var(--padding-vertical);
            margin-right: var(--padding-horizontal);
            margin-bottom: var(--padding-vertical);
        }

        .logo {
            background-color: var(--color-surface-variant);
            border: var(--color-outline) solid var(--line-thickness);
            border-radius: var(--corner-medium);
            width: var(--image-large);
            height: var(--image-large);
            min-width: var(--image-large);
            min-height: var(--image-large);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: var(--padding-horizontal);
        }

        .abbreviation {
            font-weight: bold;
            color: var(--color-primary);
            font-size: var(--font-body-large);
            text-align: center;
        }

        .drawable {
            width: 100%;
            height: 100%;
        }

        .header-text-container {
            display: flex;
            flex-direction: column;
        }

        .header-text-container>.title {
            font-weight: bold;
            font-size: var(--font-body-medium);
        }

        .header-text-container>.description {
            color: var(--color-on-surface-variant);
            font-size: var(--font-body-medium);
        }

        .tags {
            margin: 0px;
            padding-left: var(--padding-horizontal);
            padding-right: var(--padding-horizontal);
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
        }

        .tag {
            border: var(--color-outline) solid var(--line-thickness);
            padding: 2px 8px;
            border-radius: 100px;
            margin: 0px;
            margin-bottom: var(--padding-vertical);
            margin-right: var(--padding-horizontal);
            color: var(--color-on-surface-variant);
            background-color: var(--color-surface-variant);
            font-size: var(--font-body-medium);
        }

        .details {
            padding-left: var(--padding-horizontal);
            padding-right: var(--padding-horizontal);
            display: flex;
            flex-direction: column;
            border-left: var(--color-outline) solid var(--line-thickness);
        }

        .detail {
            display: flex;
            flex-direction: column;
            margin-top: var(--padding-vertical);
            margin-bottom: var(--padding-vertical);
        }

        .detail .name {
            font-size: var(--font-body-medium);
            color: var(--color-on-surface-variant);
        }

        .detail .content {
            font-size: var(--font-body-medium);
            font-family: monospace;
        }
    </style>
</head>

<body>
{entries}
</body>

</html>
