<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8" />
    <style>
        :root {
            --color-surface: #FAF9FE;
            --color-surface-variant: #E9E7EC;
            --color-primary: #1D7874;
            --color-on-surface: #1B1A1F;
            --color-on-surface-variant: #444750;
            --color-outline: #C5C7C6;

            --margin-horizontal: 16px;
            --padding-horizontal: 12px;
            --padding-vertical: 8px;

            --image-small: 24px;
            --image-medium: 36px;
            --image-large: 48px;

            --corner-small: 12px;
            --corner-medium: 16px;
            --corner-large: 24px;

            --font-body-smaaccountsll: 16px;
            --font-body-medium: 18px;
            --font-body-large: 24px;

            --line-thickness: 2px;
        }


        body {
            background: var(--color-surface);
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--color-on-surface);
        }

        @page {
            size: A4;
        }


        .account-card {
            background-color: var(--color-surface);
            border: var(--color-outline) solid var(--line-thickness);
            border-radius: var(--corner-large);
            margin: var(--padding-vertical) var(--margin-horizontal);
			break-inside: avoid;
			page-break-inside: avoid;
        }
        .header {
            display: flex;
            flex-direction: row;
            margin-left: var(--padding-horizontal);
            margin-top: var(--padding-vertical);
            margin-right: var(--padding-horizontal);
            margin-bottom: var(--padding-vertical);
        }
        .logo {
            background-color: var(--color-surface-variant);
            border: var(--color-outline) solid var(--line-thickness);
            border-radius: var(--corner-medium);
            width: var(--image-large);
            height: var(--image-large);
            min-width: var(--image-large);
            min-height: var(--image-large);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: var(--padding-horizontal);
        }
        .abbreviation {
            font-weight: bold;
            color: var(--color-primary);
            font-size: var(--font-body-large);
            text-align: center;
        }
		.drawable {
			width: 100%;
			height: 100%;
		}
        .header-text-container {
            display: flex;
            flex-direction: column;
        }
        .header-text-container > .title {
            font-weight: bold;
            font-size: var(--font-body-medium);
        }
        .header-text-container > .description {
            color: var(--color-on-surface-variant);
            font-size: var(--font-body-medium);
        }

        .tags {
            margin: 0px;
            padding-left: var(--padding-horizontal);
            padding-right: var(--padding-horizontal);
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
        }
        .tag {
            border: var(--color-outline) solid var(--line-thickness);
            padding: 4px 12px;
            border-radius: 100px;
            margin: 0px;
            margin-bottom: var(--padding-vertical);
            margin-right: var(--padding-horizontal);
            color: var(--color-on-surface-variant);
            background-color: var(--color-surface-variant);
        }

        .details {
            padding-left: var(--padding-horizontal);
            padding-right: var(--padding-horizontal);
            display: flex;
            flex-direction: column;
            border-top: var(--color-outline) solid var(--line-thickness);
        }
        .detail {
            display: flex;
            flex-direction: column;
            margin-top: var(--padding-vertical);
            margin-bottom: var(--padding-vertical);
        }
        .detail .name {
            font-size: var(--font-body-small);
            color: var(--color-on-surface-variant);
        }
        .detail .content {
            font-size: var(--font-body-medium);
            font-family: monospace;
        }
    </style>
</head>

<body>
{entries}
</body>

</html>
